pre-commit:
  parallel: true
  commands:
    spotless-apply:
      glob: "*.{java,kt,kts}"
      run: docker compose run --rm -T dev ./gradlew spotlessApply --quiet
      stage_fixed: true
    typos-fix:
      run: docker compose run --rm -T dev typos --write-changes {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    check:
      run: docker compose run --rm -T dev ./gradlew check --quiet
    typos:
      run: docker compose run --rm -T dev typos
