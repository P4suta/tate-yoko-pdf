name: Auto-rerun flaky CI

# GitHub Actions has no built-in retry for transient infrastructure blips —
# Docker Hub pulls, JDK / dependency downloads, runner hiccups. This re-runs only
# the failed jobs of a failed run, but exactly ONCE (run_attempt == 1), so a
# genuinely broken build still fails fast on the second attempt instead of
# looping forever.
#
# Must live on the default branch to fire: a workflow_run trigger always uses the
# workflow definition from the repository's default branch, regardless of which
# branch the upstream run was on.
on:
  workflow_run:
    workflows: ["CI", "Docker dev image"]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh run rerun --failed
    steps:
      - name: Re-run failed jobs once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          echo "Re-running failed jobs of '$RUN_NAME' run #$RUN_NUMBER (first attempt failed)."
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
