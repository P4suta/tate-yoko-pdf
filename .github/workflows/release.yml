name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: tate-yoko-pdf-linux-x86_64
            binary: tate-yoko-pdf
          - os: macos-latest
            asset_name: tate-yoko-pdf-macos
            binary: tate-yoko-pdf
          - os: windows-latest
            asset_name: tate-yoko-pdf-windows-x86_64.exe
            binary: tate-yoko-pdf.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm-community"
          cache: "gradle"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Native compile
        run: ./gradlew nativeCompile --no-daemon

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/native/nativeCompile/${{ matrix.binary }} "artifacts/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
