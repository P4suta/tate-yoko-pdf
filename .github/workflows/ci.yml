name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs that publish artifacts opt into `actions: write`.
permissions:
  contents: read

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  check:
    name: check (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    steps:
      - uses: actions/checkout@v6
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # setup-gradle handles caches + writes a per-job Build dashboard to the run summary.
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle check (test + spotless + errorprone + nullaway + jacoco)
        run: ./gradlew check --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
          if-no-files-found: ignore

  # Linux native build + full smoke (real PDF conversion through CLI and Web)
  # uses Liberica NIK via Docker so AWT/font subsystems work out of the box.
  # NOTE: job name keeps the legacy `native-image (ubuntu-latest)` so branch
  # protection's required-status-checks list stays stable across this refactor.
  native-linux:
    name: native-image (ubuntu-latest)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    # Build the dev container with the runner's UID/GID so the `dev` user
    # inside the container can write into the bind-mounted /workspace
    # (otherwise Gradle fails creating /workspace/.gradle/configuration-cache).
    env:
      DEV_UID: 1001
      DEV_GID: 1001
    steps:
      - uses: actions/checkout@v5
      - name: Resolve runner UID/GID
        run: |
          echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build dev container (Liberica NIK)
        run: docker compose build dev
      - name: Native compile via Docker
        run: docker compose run --rm dev ./gradlew nativeCompile createSamplePdf --no-daemon
      - name: Native CLI smoke (real PDF conversion)
        run: |
          docker compose run --rm dev bash -c '
            ./build/native/nativeCompile/tate-yoko-pdf \
              build/test-data/sample.pdf \
              -o build/test-data/native-out.pdf \
            && test -s build/test-data/native-out.pdf
          '
          file build/test-data/native-out.pdf | grep -q PDF
      - name: Native Web smoke (upload → download)
        run: |
          docker compose --profile web-native up -d web-native
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/live  | grep -F '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/health/ready | grep -F '"status":"UP"'
          REDIRECT=$(curl -sS -o /dev/null -w "%{redirect_url}" \
            -F "pdf=@build/test-data/sample.pdf;type=application/pdf" \
            http://127.0.0.1:8080/jobs)
          JOB_ID=$(echo "$REDIRECT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}')
          test -n "$JOB_ID"
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" \
              "http://127.0.0.1:8080/jobs/$JOB_ID/result")
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 1
          done
          curl -fsS -o /tmp/web-out.pdf "http://127.0.0.1:8080/jobs/$JOB_ID/download"
          file /tmp/web-out.pdf | grep -q PDF
          # error path: invalid UUID
          curl -sS -o /tmp/err.html "http://127.0.0.1:8080/jobs/bad/progress"
          grep -q JOB_NOT_FOUND /tmp/err.html
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs web-native || true
      - name: Stop web-native
        if: always()
        run: docker compose --profile web-native down web-native || true
      - name: Upload native binary
        uses: actions/upload-artifact@v5
        with:
          name: tate-yoko-pdf-linux
          path: |
            build/native/nativeCompile/tate-yoko-pdf
            build/native/nativeCompile/*.so
          if-no-files-found: ignore

  # macOS / Windows builds still use stock GraalVM CE (no full AWT smoke yet).
  # Liberica NIK setup for these runners is tracked separately; see README.
  native-other:
    name: native-image (${{ matrix.os }})
    needs: check
    permissions:
      contents: read
      actions: write  # upload-artifact
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Native compile
        run: ./gradlew nativeCompile --no-daemon
      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: tate-yoko-pdf-${{ matrix.os }}
          path: |
            build/native/nativeCompile/tate-yoko-pdf*
            build/native/nativeCompile/*.dll
            build/native/nativeCompile/*.dylib
          if-no-files-found: ignore

  # Surfaces recent main-branch CI wall-clock times in the run summary so any
  # regression is visible without external dashboards. See docs/perf-baseline.md
  # for the rolling history.
  perf-report:
    name: perf report
    needs: [typos, check, native-linux, native-other]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Median of last 10 successful main runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI wall-clock — last 10 successful main runs"
            echo
            gh run list --workflow=ci.yml --branch=main --limit 20 \
                --json createdAt,updatedAt,conclusion,databaseId,headSha \
                --repo "${{ github.repository }}" \
              | jq -r '
                  map(select(.conclusion == "success"))
                  | map(. + {durationS: (((.updatedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) | floor)})
                  | sort_by(.createdAt) | reverse | .[0:10]
                  | (map(.durationS) | sort) as $sorted
                  | "median: \($sorted[$sorted | length / 2 | floor])s, min: \($sorted[0])s, max: \($sorted[-1])s, n=\($sorted | length)"
                ' || echo "(perf metrics unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
