name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs that publish artifacts opt into `actions: write`.
permissions:
  contents: read

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  check:
    name: check (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
      # setup-gradle handles caches + writes a per-job Build dashboard to the run summary.
      - uses: gradle/actions/setup-gradle@v6
      - name: Install qpdf for the @EnabledIf linearization integration test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf
      - name: Gradle check (test + spotless + errorprone + nullaway + spotbugs + jacoco)
        run: ./gradlew check --no-daemon
      - name: Upload test + SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
            build/reports/spotbugs
          if-no-files-found: ignore

  # All three OS app-images build directly on the GitHub-hosted runner via
  # setup-java (Liberica), which ships the jmods jlink needs. jpackage emits
  # OS-native launchers (Contents/MacOS/<name> on macOS, <name>.exe on Windows),
  # so each must build on its matching host.
  #
  # Linux used to build inside the dev container, but `docker/setup-buildx-action`
  # pulling buildkit from Docker Hub was the single biggest CI flake source. Now
  # every OS is on the same Docker-Hub-free path. The dev image itself is still
  # exercised by docker-image.yml when the Dockerfile changes (and weekly).
  package:
    name: jpackage (${{ matrix.os }})
    needs: check
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build app-image
        run: ./gradlew jpackageImage createSamplePdf --no-daemon
      - name: CLI smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/dist-jpackage/tate-yoko-pdf/bin/tate-yoko-pdf \
            build/test-data/sample.pdf -o build/test-data/jpackage-out.pdf
          grep -q %PDF build/test-data/jpackage-out.pdf
      - name: CLI smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          ./build/dist-jpackage/tate-yoko-pdf.app/Contents/MacOS/tate-yoko-pdf \
            build/test-data/sample.pdf -o build/test-data/jpackage-out.pdf
          grep -q %PDF build/test-data/jpackage-out.pdf
      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # tate-yoko-pdf.exe is a console-subsystem launcher (built with
          # --win-console) so its stdout/stderr reach the terminal. Start-Process
          # -Wait blocks until the conversion finishes before the file read below.
          $proc = Start-Process -Wait -NoNewWindow -PassThru `
            -FilePath ".\build\dist-jpackage\tate-yoko-pdf\tate-yoko-pdf.exe" `
            -ArgumentList @(
              'build\test-data\sample.pdf',
              '-o',
              'build\test-data\jpackage-out.pdf'
            )
          if ($proc.ExitCode -ne 0) { throw "tate-yoko-pdf.exe exited $($proc.ExitCode)" }
          $bytes = [System.IO.File]::ReadAllBytes("build/test-data/jpackage-out.pdf")
          $head = [System.Text.Encoding]::ASCII.GetString($bytes[0..3])
          if ($head -ne '%PDF') { throw "Output is not a PDF: prefix=$head" }
      - name: Package app-image as zip (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/dist-jpackage
          zip -r ../tate-yoko-pdf-linux.zip tate-yoko-pdf
      - name: Package app-image as zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/dist-jpackage
          zip -ry ../tate-yoko-pdf-${{ matrix.os }}.zip tate-yoko-pdf.app
      - name: Package app-image as zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/dist-jpackage/tate-yoko-pdf `
            -DestinationPath build/tate-yoko-pdf-${{ matrix.os }}.zip
      - name: Upload app-image zip
        uses: actions/upload-artifact@v7
        with:
          name: tate-yoko-pdf-${{ runner.os == 'Linux' && 'linux' || matrix.os }}
          path: build/tate-yoko-pdf-*.zip
          if-no-files-found: error

  # Surfaces recent main-branch CI wall-clock times in the run summary so any
  # regression is visible without external dashboards. See docs/perf-baseline.md
  # for the rolling history.
  perf-report:
    name: perf report
    needs: [typos, check, package]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Median of last 10 successful main runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI wall-clock — last 10 successful main runs"
            echo
            gh run list --workflow=ci.yml --branch=main --limit 20 \
                --json createdAt,updatedAt,conclusion,databaseId,headSha \
                --repo "${{ github.repository }}" \
              | jq -r '
                  map(select(.conclusion == "success"))
                  | map(. + {durationS: (((.updatedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) | floor)})
                  | sort_by(.createdAt) | reverse | .[0:10]
                  | (map(.durationS) | sort) as $sorted
                  | "median: \($sorted[$sorted | length / 2 | floor])s, min: \($sorted[0])s, max: \($sorted[-1])s, n=\($sorted | length)"
                ' || echo "(perf metrics unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
