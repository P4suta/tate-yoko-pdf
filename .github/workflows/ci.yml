name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs that publish artifacts opt into `actions: write`.
permissions:
  contents: read

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  check:
    name: check (JVM + frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      # setup-gradle handles caches + writes a per-job Build dashboard to the run summary.
      - uses: gradle/actions/setup-gradle@v6
      - name: Install qpdf for the @EnabledIf linearization integration test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf
      - name: Gradle check (test + spotless + errorprone + nullaway + spotbugs + jacoco + frontend build)
        run: ./gradlew check --no-daemon
      - name: Frontend Biome lint (.ts/.js/.json)
        working-directory: frontend
        run: corepack pnpm run biome:check
      - name: Frontend type check + svelte-check
        working-directory: frontend
        run: corepack pnpm run check
      - name: Upload test + SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
            build/reports/spotbugs
          if-no-files-found: ignore

  # Linux app-image build runs inside the dev container so the BellSoft apt repo
  # provisioning (Liberica Full Edition with jmods) is fully reproducible. The
  # CLI smoke verifies that PDFBox + AWT actually convert a real PDF end to end.
  package-linux:
    name: jpackage (ubuntu-latest)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      DEV_UID: 1001
      DEV_GID: 1001
    steps:
      - uses: actions/checkout@v6
      - name: Resolve runner UID/GID
        run: |
          echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build dev image (BuildKit + GHA cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          tags: tate-yoko-pdf-dev:latest
          load: true
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max
          build-args: |
            DEV_UID=${{ env.DEV_UID }}
            DEV_GID=${{ env.DEV_GID }}
      - name: Build app-image (jlink + jpackage) via Docker
        run: docker compose run --rm dev ./gradlew jpackageImage createSamplePdf --no-daemon
      - name: CLI smoke — real PDF conversion through the launcher
        run: |
          docker compose run --rm dev ./build/dist-jpackage/tate-yoko-pdf/bin/tate-yoko-pdf \
            build/test-data/sample.pdf -o build/test-data/jpackage-out.pdf
          docker compose run --rm dev grep -q %PDF build/test-data/jpackage-out.pdf
      - name: Package app-image as zip
        run: |
          cd build/dist-jpackage
          zip -r ../tate-yoko-pdf-linux.zip tate-yoko-pdf
      - name: Upload tate-yoko-pdf-linux.zip
        uses: actions/upload-artifact@v7
        with:
          name: tate-yoko-pdf-linux
          path: build/tate-yoko-pdf-linux.zip
          if-no-files-found: error

  # macOS and Windows app-images are built directly on the GitHub-hosted runner
  # because jpackage produces OS-native launchers (Contents/MacOS/<name> on
  # macOS, <name>.exe on Windows) that can only be created on the matching host.
  package-other:
    name: jpackage (${{ matrix.os }})
    needs: check
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enable corepack
        run: corepack enable
      - uses: gradle/actions/setup-gradle@v6
      - name: Build app-image
        run: ./gradlew jpackageImage createSamplePdf --no-daemon
      - name: CLI smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          ./build/dist-jpackage/tate-yoko-pdf.app/Contents/MacOS/tate-yoko-pdf \
            build/test-data/sample.pdf -o build/test-data/jpackage-out.pdf
          grep -q %PDF build/test-data/jpackage-out.pdf
      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Start-Process -Wait is required because tate-yoko-pdf.exe is built
          # as a windowed-subsystem launcher (no --win-console). PowerShell's
          # `&` operator only waits for console-subsystem programs; for windowed
          # ones it returns immediately, racing the file read below.
          $proc = Start-Process -Wait -NoNewWindow -PassThru `
            -FilePath ".\build\dist-jpackage\tate-yoko-pdf\tate-yoko-pdf.exe" `
            -ArgumentList @(
              'build\test-data\sample.pdf',
              '-o',
              'build\test-data\jpackage-out.pdf'
            )
          if ($proc.ExitCode -ne 0) { throw "tate-yoko-pdf.exe exited $($proc.ExitCode)" }
          $bytes = [System.IO.File]::ReadAllBytes("build/test-data/jpackage-out.pdf")
          $head = [System.Text.Encoding]::ASCII.GetString($bytes[0..3])
          if ($head -ne '%PDF') { throw "Output is not a PDF: prefix=$head" }
      - name: Package app-image as zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/dist-jpackage
          zip -ry ../tate-yoko-pdf-${{ matrix.os }}.zip tate-yoko-pdf.app
      - name: Package app-image as zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/dist-jpackage/tate-yoko-pdf `
            -DestinationPath build/tate-yoko-pdf-${{ matrix.os }}.zip
      - name: Upload tate-yoko-pdf-${{ matrix.os }}.zip
        uses: actions/upload-artifact@v7
        with:
          name: tate-yoko-pdf-${{ matrix.os }}
          path: build/tate-yoko-pdf-${{ matrix.os }}.zip
          if-no-files-found: error

  # Surfaces recent main-branch CI wall-clock times in the run summary so any
  # regression is visible without external dashboards. See docs/perf-baseline.md
  # for the rolling history.
  perf-report:
    name: perf report
    needs: [typos, check, package-linux, package-other]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Median of last 10 successful main runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI wall-clock — last 10 successful main runs"
            echo
            gh run list --workflow=ci.yml --branch=main --limit 20 \
                --json createdAt,updatedAt,conclusion,databaseId,headSha \
                --repo "${{ github.repository }}" \
              | jq -r '
                  map(select(.conclusion == "success"))
                  | map(. + {durationS: (((.updatedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) | floor)})
                  | sort_by(.createdAt) | reverse | .[0:10]
                  | (map(.durationS) | sort) as $sorted
                  | "median: \($sorted[$sorted | length / 2 | floor])s, min: \($sorted[0])s, max: \($sorted[-1])s, n=\($sorted | length)"
                ' || echo "(perf metrics unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
