name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@master

  check:
    name: check (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gradle check (test + spotless + errorprone + nullaway + jacoco)
        run: ./gradlew check --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
          if-no-files-found: ignore

  native:
    name: native-image (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Native compile
        run: ./gradlew nativeCompile --no-daemon
      - name: Generate sample PDF for smoke test
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew createSamplePdf --no-daemon
      - name: Native binary smoke test (Web — startup + /health + upload accept)
        # PDF rendering needs AWT native libs not yet bundled in the runtime image;
        # tracked separately. Here we verify that the native binary starts, serves
        # the health endpoints, and accepts a multipart upload (redirect to /progress).
        if: matrix.os == 'ubuntu-latest'
        env:
          TATE_YOKO_NO_BROWSER: "true"
          TATE_YOKO_PORT: "8080"
          TATE_YOKO_BIND: "127.0.0.1"
        run: |
          ./build/native/nativeCompile/tate-yoko-pdf &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/live | grep -F '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/health/ready | grep -F '"status":"UP"'
          curl -fsS -o /dev/null -w "POST /jobs → HTTP %{http_code}\n" \
            -F "pdf=@build/test-data/sample.pdf;type=application/pdf" \
            http://127.0.0.1:8080/jobs
          # Also verify the error path: invalid UUID renders error.jte and returns 404.
          curl -sS -o /tmp/err.html -w "GET /jobs/bad/progress → HTTP %{http_code}\n" \
            http://127.0.0.1:8080/jobs/bad/progress
          grep -q JOB_NOT_FOUND /tmp/err.html
      - name: Upload native binary
        uses: actions/upload-artifact@v5
        with:
          name: tate-yoko-pdf-${{ matrix.os }}
          path: |
            build/native/nativeCompile/tate-yoko-pdf*
            build/native/nativeCompile/*.so
            build/native/nativeCompile/*.dll
            build/native/nativeCompile/*.dylib
          if-no-files-found: ignore
