name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Only run for Dependabot PRs. Other PRs are short-circuited by the if-guard.
# Top-level minimal default; the job below repeats the grant explicitly so
# CodeQL's actions/missing-workflow-permissions rule is satisfied per-job too.
permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh pr merge requires write to merge
      pull-requests: write  # gh pr merge --auto sets the auto-merge flag
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Enable auto-merge for safe update types (minor + patch). Major bumps
      # require human review because they often need code changes.
      - name: Enable auto-merge for minor + patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
