# Fix the project name so that artifacts (volumes/networks/containers) always
# land under `tate-yoko-pdf`, regardless of cwd / worktree / dir rename.
name: tate-yoko-pdf

services:
  dev:
    build:
      context: .
      target: dev
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    image: tate-yoko-pdf-dev:latest
    container_name: tate-yoko-pdf-dev
    # Pinned to "no" so the dev container never auto-restarts on host reboot;
    # `just dev-up` is the only way it should come up.
    restart: "no"
    volumes:
      - .:/workspace
      - gradle-cache:/home/dev/.gradle
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: ["bash"]

  # Long-lived dev container — when running, `just check` / `test` / etc. dispatch
  # via `docker compose exec` instead of `run --rm`, keeping the Gradle daemon warm.
  # Start with `just dev-up`, stop with `just dev-down`.
  dev-daemon:
    extends:
      service: dev
    container_name: tate-yoko-pdf-dev-daemon
    profiles: ["dev"]
    command: ["tail", "-f", "/dev/null"]

volumes:
  gradle-cache:
    # Opt out of the host-wide `docker-prune.timer` so the Gradle cache
    # survives weekly cleanups even when no container is currently using it.
    labels: ["docker-prune.keep=true"]
